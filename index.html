<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>AllHealth - Login</title>
  <link rel="stylesheet" href="styles.css" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Ctext y='14'%3E%F0%9F%A9%BA%3C/text%3E%3C/svg%3E" />
</head>
<body>
  <div class="login-container">
    <div class="login-box">
      <h1>AllHealth Portal</h1>
      <div class="input-group">
        <label>Email</label>
        <input id="email" type="email"/>
      </div>
      <div class="input-group">
        <label>Password</label>
        <input id="password" type="password"/>
      </div>
      <button class="btn-primary" id="loginBtn">Login</button>
    </div>
  </div>

  <script type="module">
    import { login, watchAuth } from "./js/auth.js";
    watchAuth(
      () => window.location.href = "dashboard.html",
      () => {}
    );
    document.getElementById("loginBtn").addEventListener("click", async () => {
      const email = document.getElementById("email").value;
      const password = document.getElementById("password").value;
      try {
        await login(email, password);
      } catch (e) {
        alert("Login failed");
      }
    });
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>AllHealth - Dashboard</title>
  <link rel="stylesheet" href="styles.css" />
  <link rel="icon" href="logo.png" type="image/png" />
</head>
<body class="dashboard-body">
  <div class="dashboard-shell">
    <header class="dashboard-header">
      <div class="brand">
        <span class="brand-mark">
          <img src="logo.png" alt="AllHealth logo" />
        </span>
        <div>
          <p class="brand-kicker">AllHealth Portal</p>
          <h1>Your Health Overview</h1>
        </div>
      </div>
      <div class="header-actions">
        <button id="paymentsBtn" class="status-pill status-button" type="button">Payments</button>
        <a id="logoutBtn" class="logout-btn" href="#">Logout</a>
      </div>
    </header>

    <div id="overviewView">
      <section class="welcome-card">
        <div>
          <h2>Stay on top of your care</h2>
          <p>Quickly book your appointments through the website.</p>
        </div>
        <div class="welcome-cta">
          <button id="bookHereBtn" class="btn-primary welcome-action" type="button">Book here</button>
        </div>
      </section>

      <div class="dashboard-grid">
        <div id="diagnoses" class="dashboard-card"></div>
        <div id="allergies" class="dashboard-card"></div>
        <div id="medications" class="dashboard-card"></div>
        <div id="results" class="dashboard-card"></div>
        <div id="documents" class="dashboard-card"></div>
        <div id="vaccines" class="dashboard-card"></div>
      </div>
    </div>

    <section id="paymentsView" class="payments-view view-hidden">
      <div class="payments-layout">
        <div class="info-card payments-card">
          <h2>Payments</h2>
          <p class="payments-subtitle">Your outstanding balance</p>
          <div class="payments-amount" id="balanceValue">Loading...</div>
          <div class="payments-field">
            <label for="paymentAmount">Payment amount</label>
            <input id="paymentAmount" type="number" min="0" step="0.01" placeholder="Enter amount" />
          </div>
          <button class="btn-primary" id="payBtn" type="button">Pay now</button>
          <p id="paymentNote" class="payments-note"></p>
        </div>
      </div>
    </section>

    <section id="appointmentsView" class="appointments-view view-hidden">
      <div class="appointments-layout">
        <div class="info-card appointments-card">
          <div class="appointments-header">
            <div>
              <h2>Appointments</h2>
              <p class="appointments-subtitle">Pick a date and time to book your visit.</p>
            </div>
            <button id="appointmentsBackBtn" class="btn-secondary appointments-back" type="button">Back to overview</button>
          </div>
          <div class="appointments-body">
            <div class="appointments-calendar">
              <label for="appointmentDate">Select date</label>
              <input id="appointmentDate" type="date" />
            </div>
            <div class="appointments-slots">
              <p class="appointments-slots-title">Available times</p>
              <div id="timeSlots" class="appointments-slots-grid"></div>
              <button id="confirmAppointmentBtn" class="btn-primary appointments-confirm" type="button" disabled>Confirm appointment</button>
              <p id="appointmentNote" class="appointments-note"></p>
            </div>
          </div>
        </div>
      </div>
    </section>
  </div>

  <script type="module">
    import { watchAuth, logout, getPatientIdForUser, getIsAdmin } from "./js/auth.js";
    import { loadSubcollection, getPatientBalance, processPayment, getBookedTimeSlots, bookAppointment } from "./js/data.js";
    import { renderCards } from "./js/ui.js";

    document.getElementById("logoutBtn").addEventListener("click", async (e) => {
      e.preventDefault();
      await logout();
    });

    const paymentsBtn = document.getElementById("paymentsBtn");
    const overviewView = document.getElementById("overviewView");
    const paymentsView = document.getElementById("paymentsView");
    const appointmentsView = document.getElementById("appointmentsView");
    const balanceValue = document.getElementById("balanceValue");
    const paymentAmount = document.getElementById("paymentAmount");
    const payBtn = document.getElementById("payBtn");
    const paymentNote = document.getElementById("paymentNote");
    const bookHereBtn = document.getElementById("bookHereBtn");
    const appointmentsBackBtn = document.getElementById("appointmentsBackBtn");
    const appointmentDate = document.getElementById("appointmentDate");
    const timeSlots = document.getElementById("timeSlots");
    const appointmentNote = document.getElementById("appointmentNote");
    const confirmAppointmentBtn = document.getElementById("confirmAppointmentBtn");
    let activeView = "overview";
    let currentBalance = 0;
    let balanceLoaded = false;
    let appointmentPatientId = null;
    let appointmentUserUid = null;
    let appointmentsLoading = false;
    let selectedTimeSlot = "";

    const TIME_SLOTS = [
      { label: "09:00 AM", hour: 9, minute: 0 },
      { label: "10:00 AM", hour: 10, minute: 0 },
      { label: "11:00 AM", hour: 11, minute: 0 },
      { label: "02:00 PM", hour: 14, minute: 0 },
      { label: "03:00 PM", hour: 15, minute: 0 },
      { label: "04:00 PM", hour: 16, minute: 0 },
    ];

    function setView(view) {
      activeView = view;
      const views = { overview: overviewView, payments: paymentsView, appointments: appointmentsView };
      Object.entries(views).forEach(([key, element]) => {
        if (key === view) element.classList.remove("view-hidden");
        else element.classList.add("view-hidden");
      });
      paymentsBtn.textContent = view === "payments" ? "Overview" : "Payments";
      paymentsBtn.classList.toggle("active", view === "payments");
    }

    paymentsBtn.addEventListener("click", () => {
      setView(activeView === "payments" ? "overview" : "payments");
    });

    bookHereBtn.addEventListener("click", () => {
      setView("appointments");
    });

    appointmentsBackBtn.addEventListener("click", () => {
      setView("overview");
    });

    function setPaymentNote(message, tone = "info") {
      paymentNote.textContent = message;
      paymentNote.dataset.tone = tone;
    }

    function formatCurrency(amount) {
      return `${amount.toFixed(2)}€`;
    }

    function updateBalanceDisplay() {
      balanceValue.textContent = formatCurrency(currentBalance);
    }

    async function loadBalance(patientId) {
      balanceLoaded = false;
      payBtn.disabled = true;
      balanceValue.textContent = "Loading...";
      try {
        currentBalance = await getPatientBalance(patientId);
        balanceLoaded = true;
        updateBalanceDisplay();
        payBtn.disabled = false;
        setPaymentNote("Payments update instantly in your profile.", "info");
      } catch (e) {
        balanceLoaded = false;
        balanceValue.textContent = "Unavailable";
        payBtn.disabled = true;
        setPaymentNote("We could not load your balance. Try again soon.", "error");
      }
    }

    function setAppointmentNote(message, tone = "info") {
      appointmentNote.textContent = message;
      appointmentNote.dataset.tone = tone;
    }

    function formatDateKey(date) {
      const year = date.getFullYear();
      const month = String(date.getMonth() + 1).padStart(2, "0");
      const day = String(date.getDate()).padStart(2, "0");
      return `${year}-${month}-${day}`;
    }

    function parseDateKey(dateKey) {
      const [year, month, day] = dateKey.split("-").map(Number);
      return new Date(year, month - 1, day);
    }

    function isPastDate(dateKey) {
      const date = parseDateKey(dateKey);
      const today = new Date();
      today.setHours(0, 0, 0, 0);
      return date < today;
    }

    function isToday(dateKey) {
      const todayKey = formatDateKey(new Date());
      return dateKey === todayKey;
    }

    function slotDateTime(dateKey, slot) {
      const [year, month, day] = dateKey.split("-").map(Number);
      return new Date(year, month - 1, day, slot.hour, slot.minute, 0, 0);
    }

    function renderTimeSlots(availableSlots) {
      if (!availableSlots.length) {
        timeSlots.innerHTML = "";
        return;
      }
      timeSlots.innerHTML = availableSlots
        .map((slot) => `<button class="slot-button" type="button" data-slot="${slot.label}">${slot.label}</button>`)
        .join("");
    }

    async function loadTimeSlots() {
      if (!appointmentPatientId) return;
      const dateKey = appointmentDate.value;
      if (!dateKey) return;
      if (isPastDate(dateKey)) {
        timeSlots.innerHTML = "";
        selectedTimeSlot = "";
        confirmAppointmentBtn.disabled = true;
        setAppointmentNote("Please choose a future date.", "error");
        return;
      }
      appointmentsLoading = true;
      timeSlots.innerHTML = `<span class="slots-loading">Loading...</span>`;
      selectedTimeSlot = "";
      confirmAppointmentBtn.disabled = true;
      setAppointmentNote("Checking availability...", "info");
      try {
        const booked = await getBookedTimeSlots(dateKey);
        const now = new Date();
        const availableSlots = TIME_SLOTS.filter((slot) => {
          if (booked.has(slot.label)) return false;
          if (isToday(dateKey) && slotDateTime(dateKey, slot) <= now) return false;
          return true;
        });
        renderTimeSlots(availableSlots);
        if (!availableSlots.length) {
          setAppointmentNote("No remaining slots for the selected date.", "error");
        } else {
          setAppointmentNote("Select a time, then confirm your booking.", "info");
        }
      } catch (e) {
        timeSlots.innerHTML = "";
        selectedTimeSlot = "";
        confirmAppointmentBtn.disabled = true;
        setAppointmentNote("Failed to load time slots. Please try again.", "error");
      } finally {
        appointmentsLoading = false;
      }
    }

    timeSlots.addEventListener("click", (event) => {
      const button = event.target.closest("button[data-slot]");
      if (!button || appointmentsLoading) return;
      selectedTimeSlot = button.dataset.slot || "";
      timeSlots.querySelectorAll("button[data-slot]").forEach((slotBtn) => {
        slotBtn.classList.toggle("active", slotBtn.dataset.slot === selectedTimeSlot);
      });
      if (selectedTimeSlot) {
        confirmAppointmentBtn.disabled = false;
        setAppointmentNote(`Selected ${selectedTimeSlot}. Click confirm to book.`, "info");
      } else {
        confirmAppointmentBtn.disabled = true;
        setAppointmentNote("Select a time, then confirm your booking.", "info");
      }
    });

    confirmAppointmentBtn.addEventListener("click", async () => {
      if (!appointmentPatientId || !appointmentDate.value) {
        setAppointmentNote("Please select a date first.", "error");
        return;
      }
      if (!selectedTimeSlot) {
        setAppointmentNote("Please choose a time slot.", "error");
        return;
      }
      if (appointmentsLoading) return;
      appointmentsLoading = true;
      confirmAppointmentBtn.disabled = true;
      setAppointmentNote("Booking your appointment...", "info");
      try {
        await bookAppointment({
          dateKey: appointmentDate.value,
          timeSlot: selectedTimeSlot,
          patientId: appointmentPatientId,
          userUid: appointmentUserUid,
        });
        setAppointmentNote(`Appointment booked for ${selectedTimeSlot} on ${appointmentDate.value}.`, "success");
        await loadTimeSlots();
      } catch (e) {
        if (e?.message === "slot_taken") {
          setAppointmentNote("That time was just taken. Please pick another.", "error");
          await loadTimeSlots();
        } else {
          setAppointmentNote("Failed to book appointment. Please try again.", "error");
        }
      } finally {
        appointmentsLoading = false;
      }
    });

    watchAuth(async (user) => {
      try {
        if (await getIsAdmin(user)) {
          window.location.href = "admin.html";
          return;
        }
        const patientId = await getPatientIdForUser(user);
        await loadBalance(patientId);
        appointmentPatientId = patientId;
        appointmentUserUid = user?.uid || null;

        const todayKey = formatDateKey(new Date());
        appointmentDate.min = todayKey;
        if (!appointmentDate.value) {
          appointmentDate.value = todayKey;
        }
        await loadTimeSlots();

        const [diagnoses, allergies, meds, results, documents, vaccines] = await Promise.all([
          loadSubcollection(patientId, "diagnoses", ["diagnosis", "date"]),
          loadSubcollection(patientId, "allergies", ["allergy", "severity"]),
          loadSubcollection(patientId, "medications", ["medication_name", "dosage"]),
          loadSubcollection(patientId, "results", ["result_description", "date"]),
          loadSubcollection(patientId, "documents", ["document_title", "upload_date"]),
          loadSubcollection(patientId, "vaccines", ["vaccine_name", "date_administered"]),
        ]);

        renderCards(document.getElementById("diagnoses"), "Diagnoses", diagnoses, ["diagnosis", "date"], ["Diagnosis", "Date"]);
        renderCards(document.getElementById("allergies"), "Allergies", allergies, ["allergy", "severity"], ["Allergy", "Severity"]);
        renderCards(document.getElementById("medications"), "Medications", meds, ["medication_name", "dosage"], ["Medication", "Dosage"]);
        renderCards(document.getElementById("results"), "Results", results, ["result_description", "date"], ["Description", "Date"]);
        renderCards(document.getElementById("documents"), "Documents", documents, ["document_title", "upload_date"], ["Title", "Upload Date"]);
        renderCards(document.getElementById("vaccines"), "Vaccines", vaccines, ["vaccine_name", "date_administered"], ["Vaccine", "Date"]);

        appointmentDate.addEventListener("change", loadTimeSlots);

        paymentAmount.addEventListener("input", () => {
          if (!balanceLoaded) {
            payBtn.disabled = true;
            return;
          }
          const raw = paymentAmount.value.trim();
          if (!raw) {
            payBtn.disabled = false;
            setPaymentNote("Enter an amount to pay toward your balance.", "info");
            return;
          }
          const value = Number.parseFloat(raw);
          if (!Number.isFinite(value) || value <= 0) {
            payBtn.disabled = true;
            setPaymentNote("Enter a valid payment amount.", "error");
            return;
          }
          if (value > currentBalance) {
            payBtn.disabled = true;
            setPaymentNote("Payment amount cannot exceed your remaining balance.", "error");
            return;
          }
          payBtn.disabled = false;
          setPaymentNote("Ready to apply this payment.", "success");
        });

        payBtn.addEventListener("click", async () => {
          if (!balanceLoaded) {
            setPaymentNote("Loading your balance. Please wait.", "error");
            return;
          }
          const value = Number.parseFloat(paymentAmount.value.trim());
          if (!Number.isFinite(value) || value <= 0) {
            setPaymentNote("Please enter a valid amount.", "error");
            return;
          }
          if (value > currentBalance) {
            setPaymentNote("Payment amount cannot exceed your remaining balance.", "error");
            return;
          }
          payBtn.disabled = true;
          try {
            const newBalance = await processPayment(patientId, value);
            currentBalance = newBalance;
            updateBalanceDisplay();
            paymentAmount.value = "";
            setPaymentNote(`Payment of ${formatCurrency(value)} processed successfully.`, "success");
            payBtn.disabled = false;
          } catch (e) {
            if (e?.message === "amount_exceeds_balance") {
              setPaymentNote("Payment amount cannot exceed your remaining balance.", "error");
            } else {
              setPaymentNote("Payment failed. Please try again.", "error");
            }
            payBtn.disabled = false;
          }
        });
      } catch (e) {
        alert("Failed to load data");
      }
    }, () => {
      window.location.href = "index.html";
    });
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>AllHealth - Admin</title>
  <link rel="stylesheet" href="styles.css" />
  <link rel="icon" href="logo.png" type="image/png" />
</head>
<body class="dashboard-body admin-body">
  <div class="dashboard-shell">
    <header class="dashboard-header admin-dashboard-header">
      <div class="brand">
        <span class="brand-mark">
          <img src="logo.png" alt="AllHealth logo" />
        </span>
        <div>
          <p class="brand-kicker">AllHealth Portal</p>
          <h1>Admin Panel</h1>
        </div>
      </div>
      <div class="header-actions">
        <a id="logoutBtn" class="logout-btn" href="#">Logout</a>
      </div>
    </header>

    <section id="listView" class="info-card admin-panel-card">
      <div class="admin-panel-head">
        <h2>Patients</h2>
      </div>
      <div class="admin-table-wrap">
        <table class="admin-table">
          <thead>
            <tr>
              <th>Patient Name</th>
            </tr>
          </thead>
          <tbody id="patientsBody"></tbody>
        </table>
      </div>
    </section>

    <section id="detailView" class="info-card admin-panel-card view-hidden">
      <div class="detail-header">
        <h2 id="detailTitle">Patient Details</h2>
        <a href="#" id="detailBackBtn" class="btn-secondary">Back</a>
      </div>

      <div class="patient-form admin-profile-grid">
        <div class="form-section">
          <label for="editPid">Patient ID</label>
          <input id="editPid" type="text" disabled />
        </div>
        <div class="form-section">
          <label for="editFirst">First name</label>
          <input id="editFirst" type="text" />
        </div>
        <div class="form-section">
          <label for="editSecond">Second name</label>
          <input id="editSecond" type="text" />
        </div>
      </div>

      <div id="details" class="detail-sections"></div>

      <div class="detail-footer">
        <a href="#" id="saveBtn" class="btn-primary">Save</a>
      </div>
    </section>
  </div>

  <script type="module">
    import { watchAuth, logout, getIsAdmin } from "./js/auth.js";
    import { loadAllPatients, loadPatientProfile, loadPatientDetails, updatePatient, updateSubItem } from "./js/admin.js";
    document.getElementById("logoutBtn").addEventListener("click", async (e) => {
      e.preventDefault();
      await logout();
    });

    watchAuth(async (user) => {
      if (!(await getIsAdmin(user))) {
        alert("Not authorized");
        window.location.href = "dashboard.html";
        return;
      }
      await loadPatientList();

      document.getElementById('detailBackBtn').addEventListener('click', (e) => {
        e.preventDefault();
        showListView();
      });

      document.getElementById('saveBtn').addEventListener('click', async (e) => {
        e.preventDefault();
        await savePatientChanges();
      });
    }, () => {
      window.location.href = "index.html";
    });

    function escapeHtml(s) {
      return String(s ?? "")
        .replace(/&/g, "&amp;").replace(/</g, "&lt;")
        .replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
    }

    const sections = [
      { key: 'diagnoses', title: 'Diagnoses', fields: ['diagnosis','date'] },
      { key: 'allergies', title: 'Allergies', fields: ['allergy','severity'] },
      { key: 'medications', title: 'Medications', fields: ['medication_name','dosage'] },
      { key: 'results', title: 'Results', fields: ['result_description','date'] },
      { key: 'documents', title: 'Documents', fields: ['document_title','upload_date'] },
      { key: 'vaccines', title: 'Vaccines', fields: ['vaccine_name','date_administered'] },
    ];

    let activePatientId = null;

    async function loadPatientList() {
      const rows = await loadAllPatients();
      const tbody = document.getElementById("patientsBody");
      if (!rows || rows.length === 0) {
        tbody.innerHTML = `<tr><td>No patients found.</td></tr>`;
        return;
      }
      tbody.innerHTML = rows.map(r => `
        <tr>
          <td>
            <a href="#" class="name-link" data-pid="${escapeHtml(r.id)}">${escapeHtml(r.first_name)} ${escapeHtml(r.second_name)}</a>
          </td>
        </tr>
      `).join("");

      tbody.onclick = async (ev) => {
        const target = ev.target.closest('a');
        if (!target) return;
        ev.preventDefault();
        const pid = target.getAttribute('data-pid');
        await openDetailView(pid);
      };
    }

    async function openDetailView(pid) {
      activePatientId = pid;
      const profile = await loadPatientProfile(pid);
      const details = await loadPatientDetails(pid);
      document.getElementById('editPid').value = pid;
      document.getElementById('editFirst').value = profile.first_name || '';
      document.getElementById('editSecond').value = profile.second_name || '';
      document.getElementById('detailTitle').textContent = `${profile.first_name || ''} ${profile.second_name || ''}`.trim() || 'Patient Details';
      renderDetailSections(details);
      showDetailView();
    }

    function showListView() {
      document.getElementById('listView').classList.remove('view-hidden');
      document.getElementById('detailView').classList.add('view-hidden');
      activePatientId = null;
    }

    function showDetailView() {
      document.getElementById('listView').classList.add('view-hidden');
      document.getElementById('detailView').classList.remove('view-hidden');
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function renderDetailSections(details) {
      const container = document.getElementById('details');
      container.innerHTML = sections.map(sec => {
        const rows = (details[sec.key] || []).map(item => renderRow(sec, item)).join('');
        const emptyRow = `<p class="section-empty">No records yet.</p>`;
        return `
          <div class="section-card">
            <div class="section-header">
              <h3>${escapeHtml(sec.title)}</h3>
            </div>
            <div class="section-items" data-sec="${sec.key}">
              ${rows || emptyRow}
            </div>
          </div>
        `;
      }).join('');
    }

    function renderRow(sec, item) {
      const fields = sec.fields.map(f => {
        const value = formatFieldValue(f, item[f]);
        const type = isDateField(f) ? 'date' : 'text';
        return `
          <div class="detail-item-field">
            <label>${escapeHtml(labelOf(f))}</label>
            <input type="${type}" data-field="${f}" value="${escapeHtml(value)}" />
          </div>
        `;
      }).join('');
      return `
        <div class="detail-item" data-sec="${sec.key}" data-id="${escapeHtml(item.id || '')}">
          <div class="detail-item-grid">
            ${fields}
          </div>
        </div>
      `;
    }

    async function savePatientChanges() {
      if (!activePatientId) return;
      const pid = activePatientId;
      const first = document.getElementById('editFirst').value.trim();
      const second = document.getElementById('editSecond').value.trim();
      try {
        await updatePatient(pid, { first_name: first, second_name: second });
        for (const sec of sections) {
          const body = document.querySelector(`.section-items[data-sec="${sec.key}"]`);
          if (!body) continue;
          const rows = Array.from(body.querySelectorAll('.detail-item'));
          const updates = [];
          rows.forEach(row => {
            const item = {};
            sec.fields.forEach(f => {
              const input = row.querySelector(`input[data-field="${f}"]`);
              item[f] = (input?.value || '').trim();
            });
            const id = row.getAttribute('data-id');
            if (id) {
              updates.push({ id, item });
            }
          });
          await Promise.all(updates.map(u => updateSubItem(pid, sec.key, u.id, u.item)));
        }
        alert('Changes saved');
        await loadPatientList();
        showListView();
      } catch (err) {
        alert('Save failed');
      }
    }

    function labelOf(f) {
      const map = {
        diagnosis: 'Diagnosis',
        date: 'Date',
        allergy: 'Allergy',
        severity: 'Severity',
        medication_name: 'Medication',
        dosage: 'Dosage',
        result_description: 'Description',
        document_title: 'Title',
        upload_date: 'Upload Date',
        vaccine_name: 'Vaccine',
        date_administered: 'Date',
      };
      return map[f] || f;
    }

    function isDateField(field) {
      return ['date', 'upload_date', 'date_administered'].includes(field);
    }

    function formatFieldValue(field, value) {
      if (!isDateField(field)) return value || '';
      if (!value) return '';
      if (typeof value === 'string') {
        const parsed = new Date(value);
        return Number.isNaN(parsed.getTime()) ? value : toDateInputValue(parsed);
      }
      if (typeof value === 'object') {
        if (typeof value.toDate === 'function') {
          return toDateInputValue(value.toDate());
        }
        if (typeof value.seconds === 'number') {
          return toDateInputValue(new Date(value.seconds * 1000));
        }
      }
      return '';
    }

    function toDateInputValue(date) {
      const year = date.getFullYear();
      const month = String(date.getMonth() + 1).padStart(2, '0');
      const day = String(date.getDate()).padStart(2, '0');
      return `${year}-${month}-${day}`;
    }
  </script>
</body>
</html>
